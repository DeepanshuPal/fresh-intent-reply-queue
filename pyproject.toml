[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-intent-reply-queue"
version = "0.1.0"
description = "Fresh buyer-intent discovery (Reddit RSS + HN Algolia) with a human approval queue. BYOK, local-first, no Reddit API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
replyqueue = "replyqueue.cli:main"

[tool.setuptools.packages.find]
include = ["replyqueue*"]
